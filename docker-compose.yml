services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "4240:4240"
    volumes:
      - ./frontend:/app/
      - /app/node_modules/
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8040:8040"
    volumes:
      - ./backend/app:/app/app
    environment:
      - DB_DRIVER=postgresql
      - DB_HOST=db
      - DB_NAME=kabuki
      - DB_USER=postgres
      - DB_PASS=postgres
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kabuki
    ports:
      - "5452:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kabuki"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
