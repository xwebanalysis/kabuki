<nav class="topbar">
  <div class="brand">
    <h1 class="t-heading">KABUKI</h1>
    <span class="t-label">{{ t('app.tagline') }}</span>
  </div>

  <div class="topbar-nav">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="t-label nav-link"
    >
      [ {{ t('nav.analyzer') }} ]
    </a>
    <a routerLink="/history" routerLinkActive="active" class="t-label nav-link">
      [ {{ t('nav.history') }} ]
    </a>
  </div>

  <div class="topbar-actions">
    <span
      class="t-label status-label"
      [class.text-success]="backendOnline"
      [class.text-accent]="!backendOnline"
    >
      [{{ backendOnline ? 'BACKEND ONLINE' : 'BACKEND OFFLINE' }}]
    </span>
    <button type="button" class="theme-toggle-btn" (click)="toggleLocale()">
      <span>{{ localeLabel() }}</span>
    </button>
    <button type="button" class="theme-toggle-btn" (click)="toggleTheme()">
      <span>{{ themeLabel() }}</span>
    </button>
  </div>
</nav>

<main class="container dot-grid-subtle">
  <router-outlet />
</main>
